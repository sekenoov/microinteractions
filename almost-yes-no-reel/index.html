<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almost</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <section class="panel chat" id="chat">
      <header class="chead">
        <span class="ctitle">Texting an ex</span>
        <button class="icb" aria-label="New chat" tabindex="-1">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.8H6A2.2 2.2 0 0 0 3.8 6v8A2.2 2.2 0 0 0 6 16.2h8a2.2 2.2 0 0 0 2.2-2.2v-3"/><path d="M14.6 3.2l2.2 2.2-6.4 6.4-2.9.7.7-2.9z"/></svg>
        </button>
      </header>
      <div class="thread" id="thread">
        <div class="page">
          <div class="bub" id="q"></div>
          <div class="ans" id="ans">
            <div class="meas" id="meas" aria-hidden="true"></div>
            <div class="pick" id="pick" aria-hidden="true">
              <div class="psh" id="psh"></div>
              <div class="pclip" id="pclip"></div>
            </div>
          </div>
          <div class="acts" id="acts">
            <span class="ab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="7" y="7" width="9.5" height="9.5" rx="2.2"/><path d="M13 7V5.2A1.7 1.7 0 0 0 11.3 3.5H5.2A1.7 1.7 0 0 0 3.5 5.2v6.1A1.7 1.7 0 0 0 5.2 13H7"/></svg></span>
            <span class="ab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9l3-5.5c1.2 0 2 .9 1.8 2.1L10.8 8h4.3c1 0 1.7.9 1.5 1.9l-1.1 5.3c-.2.8-.9 1.3-1.7 1.3H6.5zM6.5 9H4v7.5h2.5"/></svg></span>
            <span class="ab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.8h-3.8"/></svg></span>
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="cfield">Ask anything</div>
        <button class="send dim" aria-label="Send" tabindex="-1">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 16V4.6M4.8 9.8L10 4.4l5.2 5.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <svg class="cur" id="cur" viewBox="0 0 24 24" aria-hidden="true">
        <g class="arrow"><path d="M5 2.6v16.2l4-3.9 2.6 6 2.7-1.2-2.6-5.9h5.6z" fill="#fff"/><path d="M6.2 5.4v10.6l2.9-2.8 2.8 6.3.6-.3-2.7-6.2h4.1z" fill="#111"/></g>
        <g class="ns"><path d="M12 3L16.6 8.2H13.1V15.8H16.6L12 21L7.4 15.8H10.9V8.2H7.4Z" fill="#111" stroke="#fff" stroke-width="2.1" stroke-linejoin="round" paint-order="stroke"/></g>
      </svg>
    </section>
  </div>

  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <span class="hint">Drag a dotted word up or down</span>
    <button class="ghost" id="snd" aria-pressed="true">Sound on</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
