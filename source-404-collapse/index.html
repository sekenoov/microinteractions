<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Source</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <div class="zoom" id="zoom">
      <div class="mover" id="mover">
        <section class="panel chat" id="chat" aria-label="Chat">
          <header class="chead">
            <span class="icb" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2.6"/><path d="M8 4.3v11.4"/></svg>
            </span>
            <span class="ctitle">Coffee and IQ</span>
            <span class="icb" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3.5"/><path d="M14.6 3.4l2 2-6.4 6.4-2.7.7.7-2.7z"/></svg>
            </span>
          </header>
          <div class="thread" id="thread">
            <div class="askrow"><div class="ask" id="ask">does coffee make you smarter?</div></div>
            <div class="ans" id="ans">
              <div class="flow" id="flow" aria-hidden="true"></div>
            </div>
          </div>
          <div class="composer">
            <div class="field" id="field">
              <span class="ph">Reply…</span>
              <span class="go" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15.8V4.8M5 9.6L10 4.6l5 5"/></svg></span>
            </div>
          </div>
          <div class="planks" id="planks"></div>
          <button class="chip" id="chip" aria-label="Source"><span class="ctx" id="ctx"></span></button>
        </section>
      </div>
      <svg class="cur" id="cur" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 2.6v16.2l4-3.9 2.6 6 2.7-1.2-2.6-5.9h5.6z" fill="#fff"/><path d="M6.2 5.4v10.6l2.9-2.8 2.8 6.3.6-.3-2.7-6.2h4.1z" fill="#111"/>
      </svg>
    </div>
  </div>

  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <span class="hint" id="hint">Check the source</span>
    <button class="ghost" id="snd" aria-pressed="true">Sound on</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
