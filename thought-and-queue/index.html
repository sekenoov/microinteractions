<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thought and Queue</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <div class="deck" id="deck">

      <figure class="tile">
        <section class="panel chat" id="think">
          <div class="thread"><div class="tin"></div></div>
          <div class="composer">
            <div class="cbars"></div>
            <button class="send" aria-label="Send">
              <svg class="ic ic--arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 16V4.6M4.8 9.8L10 4.4l5.2 5.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="ic ic--stop" aria-hidden="true"></span>
            </button>
          </div>
        </section>
        <figcaption><b>01</b> Thinking folds into a single line</figcaption>
      </figure>

      <figure class="tile">
        <section class="panel chat" id="queue">
          <div class="thread"><div class="tin"></div></div>
          <div class="qstack"></div>
          <div class="composer">
            <div class="cbars"></div>
            <button class="send" aria-label="Send">
              <svg class="ic ic--arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 16V4.6M4.8 9.8L10 4.4l5.2 5.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="ic ic--stop" aria-hidden="true"></span>
            </button>
          </div>
        </section>
        <figcaption><b>02</b> Send mid-answer. It waits its turn</figcaption>
      </figure>

    </div>
  </div>

  <div class="say" id="say" aria-live="polite"><span></span><span></span></div>

  <svg class="cursor" id="cursor" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5 2.8v16.6l4.1-3.9 2.7 6.1 2.6-1.1-2.7-6h5.8z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>

  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <button class="ghost" id="reset">Reset</button>
    <div class="seg-ctl" role="group" aria-label="Theme">
      <button class="on" data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
