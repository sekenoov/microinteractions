<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice, Memory, Sources</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <div class="deck" id="deck">

      <!-- 01 · диктовка -->
      <figure class="tile" data-n="1">
        <section class="panel chat" id="voice">
          <header class="chead"><span class="ctitle"><span>Sunday pancakes</span></span></header>
          <div class="thread"><div class="tin"></div></div>
          <div class="composer">
            <div class="cfield">
              <div class="ctext"></div>
              <div class="rec" aria-hidden="true">
                <span class="rdot"></span>
                <span class="rtime"></span>
                <div class="wave"></div>
              </div>
            </div>
            <button class="icb mic" aria-label="Dictate">
              <svg class="ic ic--mic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="7" y="2.6" width="6" height="10" rx="3"/><path d="M4.4 9.6a5.6 5.6 0 0 0 11.2 0M10 15.3v2.3" stroke-linecap="round"/></svg>
              <svg class="ic ic--x" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke-linecap="round"/></svg>
            </button>
            <button class="send" aria-label="Send">
              <svg class="ic ic--arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 16V4.6M4.8 9.8L10 4.4l5.2 5.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="ic ic--check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4.8 10.4l3.5 3.5 7-7.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </section>
        <figcaption><b>01</b> The waveform turns into what you said</figcaption>
      </figure>

      <!-- 02 · память -->
      <figure class="tile" data-n="2">
        <section class="panel chat" id="memory">
          <header class="chead">
            <span class="ctitle"><span>Quick lunch</span></span>
            <div class="hbtns">
              <button class="icb hb newchat" aria-label="New chat">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true"><path d="M9.2 3.6H6a2.4 2.4 0 0 0-2.4 2.4v8A2.4 2.4 0 0 0 6 16.4h8a2.4 2.4 0 0 0 2.4-2.4v-3.2" stroke-linecap="round"/><path d="M14.6 2.9l2.5 2.5-6.4 6.4-3.1.6.6-3.1z" stroke-linejoin="round"/></svg>
              </button>
              <button class="icb hb membtn" aria-label="Memory">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true"><rect x="3.4" y="5.6" width="13.2" height="11" rx="2.4"/><path d="M6 3.4h8M7 9.4h6M7 12.6h3.6" stroke-linecap="round"/></svg>
              </button>
            </div>
          </header>
          <div class="mpop" aria-hidden="true">
            <div class="mphead"><span>Memory</span><span class="mpn"><span class="mcount"></span> saved</span></div>
            <div class="mlist"></div>
          </div>
          <div class="thread"><div class="tin"></div></div>
          <div class="composer">
            <div class="cfield"><div class="ctext"></div></div>
            <button class="icb mic" aria-label="Dictate" tabindex="-1">
              <svg class="ic ic--mic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="7" y="2.6" width="6" height="10" rx="3"/><path d="M4.4 9.6a5.6 5.6 0 0 0 11.2 0M10 15.3v2.3" stroke-linecap="round"/></svg>
            </button>
            <button class="send" aria-label="Send">
              <svg class="ic ic--arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 16V4.6M4.8 9.8L10 4.4l5.2 5.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </section>
        <figcaption><b>02</b> Said once, remembered next time</figcaption>
      </figure>

      <!-- 03 · источники -->
      <figure class="tile" data-n="3">
        <section class="panel chat" id="sources">
          <header class="chead"><span class="ctitle"><span>Charging overnight</span></span></header>
          <div class="thread"><div class="tin"></div></div>
          <div class="composer">
            <div class="cfield"><div class="ctext"></div></div>
            <button class="icb mic" aria-label="Dictate" tabindex="-1">
              <svg class="ic ic--mic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="7" y="2.6" width="6" height="10" rx="3"/><path d="M4.4 9.6a5.6 5.6 0 0 0 11.2 0M10 15.3v2.3" stroke-linecap="round"/></svg>
            </button>
            <button class="send" aria-label="Send">
              <svg class="ic ic--arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 16V4.6M4.8 9.8L10 4.4l5.2 5.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </section>
        <figcaption><b>03</b> Reads a pile, keeps a few</figcaption>
      </figure>

    </div>
  </div>

  <div class="say" id="say" aria-live="polite"><span></span><span></span></div>

  <svg class="cursor" id="cursor" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5 2.8v16.6l4.1-3.9 2.7 6.1 2.6-1.1-2.7-6h5.8z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>

  <div class="tools" id="tools">
    <div class="seg-ctl" id="solo" role="group" aria-label="Scene">
      <button class="on" data-solo="0">All</button>
      <button data-solo="1">01</button>
      <button data-solo="2">02</button>
      <button data-solo="3">03</button>
    </div>
    <button class="ghost" id="play">Replay</button>
    <button class="ghost" id="reset">Reset</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
