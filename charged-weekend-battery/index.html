<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charged</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true"><defs id="defs"></defs></svg>
<div class="stage" id="stage">
  <div class="world" id="world">
    <div class="zoom" id="zoom">
      <div class="phone" id="phone">
        <span class="sb sb-act"></span><span class="sb sb-up"></span><span class="sb sb-dn"></span>
        <span class="sb sb-pwr"></span><span class="sb sb-cam"></span>
        <div class="bezel"></div>
        <div class="screen" id="screen">
          <header class="status">
            <span class="island"></span>
            <span class="sys" aria-hidden="true">
              <svg class="sig" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
              <svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.6l2.3-2.6a3.3 3.3 0 0 0-4.6 0z"/><path d="M8 5.7a6 6 0 0 1 4.2 1.7l1.3-1.5a8 8 0 0 0-11 0l1.3 1.5A6 6 0 0 1 8 5.7z"/><path d="M8 1.9a9.8 9.8 0 0 1 6.9 2.8l1.1-1.3a11.6 11.6 0 0 0-16 0l1.1 1.3A9.8 9.8 0 0 1 8 1.9z"/></svg>
              <span class="bat"><span class="bat-in" id="batIn"></span></span>
              <svg class="bolt-s" id="boltS" viewBox="0 0 8 12"><path d="M4.9 0L0 6.9h3.2L2.6 12 8 4.8H4.6z"/></svg>
            </span>
          </header>

          <div class="date" id="date"></div>
          <div class="clock" id="clock" role="img" aria-label="Lock screen clock"></div>

          <div class="wgt" id="wgt">
            <span class="disk"></span>
            <svg class="ring" viewBox="0 0 76 76" aria-hidden="true">
              <circle class="tr" cx="38" cy="38" r="31.5"/>
              <circle class="fl" id="ring" cx="38" cy="38" r="31.5"/>
              <circle class="hl" id="ringHl" cx="38" cy="38" r="31.5"/>
            </svg>
            <svg class="bolt" id="bolt" viewBox="0 0 8 12" aria-hidden="true"><path d="M4.9 0L0 6.9h3.2L2.6 12 8 4.8H4.6z"/></svg>
            <span class="num" id="num"></span>
          </div>

          <div class="notes" id="notes"></div>

          <span class="qa qa-l" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 3h8v3.2l-2 3.3V21h-4V9.5L8 6.2z"/><path d="M8 6.2h8"/><path d="M12 13v2.5"/></svg></span>
          <span class="qa qa-r" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 8.5a2 2 0 0 1 2-2h2.3l1.6-2.2h5.2l1.6 2.2h2.3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg></span>
          <div class="home"></div>
          <div class="off" id="off"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <span class="hint" id="hint">Drag the phone to scrub the weekend</span>
    <button class="ghost" id="snd" aria-pressed="true">Sound on</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
