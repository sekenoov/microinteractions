<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compress</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world">
    <div class="frame" id="frame">
      <canvas class="cv" id="cv" role="img" aria-label="A Finder window with three selected files: brief.pdf, hero.png and reel.mov, 48 MB in total. A right click, Compress 3 Items. A hydraulic press comes down from the top, stops, then squeezes the files until they bulge and crack flat, and a tiny squirt of bits shoots out. The flat files merge into Archive.zip and its size rolls from 48.0 MB to 47.9 MB. The press slams it again, the zip bounces back like rubber, still 47.9 MB."></canvas>
    </div>
  </div>
  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <button class="ghost" id="try" aria-pressed="false">Try it</button>
    <span class="hint" id="hint">Tap to press</span>
    <button class="ghost" id="snd" aria-pressed="true">Sound on</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
