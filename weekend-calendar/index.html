<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekend</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <div class="zoom" id="zoom">
      <section class="win" id="win">
        <header class="tb">
          <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
          <div class="seg" id="seg" role="group" aria-label="View">
            <span class="pill" id="pill"></span>
            <button data-v="0" tabindex="-1">Day</button>
            <button data-v="1">Week</button>
            <button data-v="2" tabindex="-1">Month</button>
            <button data-v="3" tabindex="-1">Year</button>
            <button data-v="4" class="we">Weekend</button>
          </div>
        </header>
        <div class="ttl">
          <span><b>October</b> 2026</span>
          <span class="nav" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
            <span class="tdy">Today</span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>
          </span>
        </div>
        <div class="heads" id="heads"><span class="today" id="today"></span></div>
        <div class="grid" id="grid"></div>
        <svg class="cur" id="cur" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 2.6v16.2l4-3.9 2.6 6 2.7-1.2-2.6-5.9h5.6z" fill="#fff"/><path d="M6.2 5.4v10.6l2.9-2.8 2.8 6.3.6-.3-2.7-6.2h4.1z" fill="#111"/>
        </svg>
      </section>
    </div>
  </div>

  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <span class="hint">Switch between Week and Weekend</span>
    <button class="ghost" id="snd" aria-pressed="true">Sound on</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
