<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compact</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <div class="deck" id="deck">
      <section class="panel chat" id="chat">
        <header class="chead">
          <span class="ctitle">Kyoto in March</span>
          <div class="ctx" id="ctx" aria-label="Context used">
            <svg viewBox="0 0 16 16" fill="none" stroke-width="2.2" aria-hidden="true">
              <circle class="rt" cx="8" cy="8" r="6"/>
              <circle class="rf" cx="8" cy="8" r="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
            </svg>
            <span class="pct"><span class="pv"></span>%</span>
          </div>
        </header>
        <div class="thread"><div class="tin"></div></div>
        <div class="note" aria-live="polite">
          <div class="nin">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6.5 3.5L10 7l3.5-3.5M6.5 16.5L10 13l3.5 3.5M3.5 10h13" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nlbl"><span class="l1">This chat is almost full.</span><span class="l2 shim">Compacting</span></span>
            <button class="cbtn">Compact</button>
          </div>
        </div>
        <div class="composer">
          <div class="cfield"><div class="ctext"></div></div>
          <button class="icb" aria-label="Dictate" tabindex="-1">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="7" y="2.6" width="6" height="10" rx="3"/><path d="M4.4 9.6a5.6 5.6 0 0 0 11.2 0M10 15.3v2.3" stroke-linecap="round"/></svg>
          </button>
          <button class="send dim" aria-label="Send">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 16V4.6M4.8 9.8L10 4.4l5.2 5.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </section>
    </div>
  </div>

  <div class="say" id="say" aria-live="polite"><span></span><span></span></div>

  <svg class="cursor" id="cursor" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5 2.8v16.6l4.1-3.9 2.7 6.1 2.6-1.1-2.7-6h5.8z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>

  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <button class="ghost" id="reset">Reset</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
