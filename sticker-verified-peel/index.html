<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world">
    <div class="frame" id="frame">
      <canvas class="cv" id="cv" role="img" aria-label="My profile, zoomed in on the new blue check next to my name. It is a sticker, and a corner starts to peel. I rub it flat, the opposite corner lifts. I press it down hard and pat it twice: it holds. Then a notification: payment failed, your Premium subscription has ended. The sticker shivers, pings off, flutters down the profile like a leaf and lands face down."></canvas>
    </div>
  </div>
  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <button class="ghost" id="try" aria-pressed="false">Try it</button>
    <span class="hint" id="hint">Rub it back down</span>
    <button class="ghost" id="snd" aria-pressed="true">Sound on</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
