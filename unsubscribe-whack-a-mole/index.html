<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world">
    <div class="frame" id="frame">
      <canvas class="cv" id="cv" role="img" aria-label="The Promotions folder with 8 unread is a whack-a-mole board. Promo emails pop out of holes: Flash sale, New drop, Your cart. A mallet whose head is a red Unsubscribe button whacks them one by one, one ducks and pops up elsewhere. The badge counts down to zero, all caught up. Then We miss you slowly rises in the middle, gets whacked, and all nine holes erupt at once: Come back, Last chance, Miss us. The badge rolls up to 99 plus, the mallet drops out of frame."></canvas>
    </div>
  </div>
  <div class="tools" id="tools">
    <button class="ghost" id="play">Replay</button>
    <button class="ghost" id="try" aria-pressed="false">Try it</button>
    <span class="hint" id="hint">Tap the emails</span>
    <button class="ghost" id="snd" aria-pressed="true">Sound on</button>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
