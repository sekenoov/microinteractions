<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overprint riso studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter+Tight:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root{--paper:#f3efe6;--blue:#0078bf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{width:1440px;height:810px;overflow:hidden;position:relative}
canvas.ink{position:absolute;left:0;top:0;width:1440px;height:810px;mix-blend-mode:multiply;will-change:transform,clip-path}
#grain{position:absolute;inset:0;width:1440px;height:810px;mix-blend-mode:multiply;opacity:.55;pointer-events:none}
.roller{position:absolute;left:0;right:0;height:46px;margin-top:-40px;background:linear-gradient(rgba(60,50,30,0),rgba(60,50,30,.08) 80%,rgba(60,50,30,.16) 96%,rgba(255,255,255,.5) 100%);pointer-events:none}
.reg{position:absolute;left:56px;top:716px;height:30px;display:flex;align-items:center;gap:16px;color:var(--blue);font-size:14px;font-weight:500;mix-blend-mode:multiply}
.reg .tr{position:relative;width:220px;height:30px}
.reg .tr::before{content:'';position:absolute;left:0;right:0;top:14px;height:2px;background:var(--blue);opacity:.35}
.reg .tk{position:absolute;top:9px;width:2px;height:12px;background:var(--blue);opacity:.35}
.reg .kn{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--blue)}
.reg .val{width:90px;font-variant-numeric:tabular-nums}
.reg .kn.on{box-shadow:0 0 0 7px rgba(0,120,191,.16)}
.tip{position:absolute;bottom:36px;left:0;transform-origin:50% 100%;white-space:nowrap;background:var(--blue);color:var(--paper);font-size:14px;font-weight:500;padding:7px 12px;border-radius:6px;opacity:0}
.tip::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--blue)}
#cur{position:absolute;left:0;top:0;width:22px;height:30px;z-index:50;pointer-events:none}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Overprint, a risograph studio in Lisbon. Printed slightly off.</h1>
<div id="layers"></div>
<div class="roller" id="roller"></div>
<canvas id="grain"></canvas>
<div class="reg" id="reg"><span>Registration</span><div class="tr"><i class="tk" style="left:0"></i><i class="tk" style="right:0"></i><div class="kn" id="kn"></div><div class="tip" id="tip">As tight as riso gets.</div></div><span class="val" id="val">2 px off</span></div>
<svg id="cur" viewBox="0 0 22 30"><path d="M2 2v22.5l5.6-5.3 3.6 8.3 3.6-1.6-3.5-8.1h7.7z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
<script>
const W=1440,H=810,DPR=window.devicePixelRatio||1;
const INK={yellow:'#ffe800',pink:'#ff48b0',blue:'#0078bf'};
const POS={x:806,y:112,w:578,h:560},HZ=POS.y+330,SUN={x:POS.x+300,y:HZ-34,r:132};
// простой детерминированный шум
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

function layer(color,draw){
  const c=document.createElement('canvas');c.className='ink';c.width=W*DPR;c.height=H*DPR;
  const x=c.getContext('2d');x.scale(DPR,DPR);x.fillStyle=color;x.strokeStyle=color;draw(x);
  // неровная краска: мягкие пятна плотности, потом зерно и редкие пропуски
  x.save();x.globalCompositeOperation='destination-out';
  for(let i=0;i<70;i++){const bx=rnd()*W,by=rnd()*H,br=50+rnd()*170,g=x.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0,`rgba(0,0,0,${0.03+rnd()*0.08})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(bx-br,by-br,br*2,br*2)}
  x.restore();
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=3;i<d.length;i+=4){if(!d[i])continue;let a=0.9+rnd()*0.1;if(rnd()<0.012)a*=0.4;d[i]*=a}
  x.putImageData(im,0,0);
  document.getElementById('layers').appendChild(c);return c;
}
function rr(x,X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}

function build(){
  const Y=layer(INK.yellow,x=>{
    x.beginPath();x.arc(SUN.x,SUN.y,SUN.r,0,Math.PI*2);x.fill();
    // отблески на воде
    for(let i=0;i<7;i++){const y=HZ+22+i*30,w=150-i*14+(i%2)*30;x.fillRect(SUN.x-w/2+(i%3-1)*14,y,w,7)}
  });
  const P=layer(INK.pink,x=>{
    // небо полутоном: точки крупнеют к горизонту
    x.save();x.beginPath();x.rect(POS.x,POS.y,POS.w,HZ-POS.y);x.clip();
    const sp=11,a=15*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);
    for(let i=-90;i<90;i++)for(let j=-90;j<90;j++){
      const px=POS.x+POS.w/2+i*sp*ca-j*sp*sa,py=POS.y+(HZ-POS.y)/2+i*sp*sa+j*sp*ca;
      if(px<POS.x-8||px>POS.x+POS.w+8||py<POS.y-8||py>HZ+8)continue;
      const v=Math.min(1,Math.max(0,(py-POS.y)/(HZ-POS.y)));const r=sp*0.62*Math.sqrt(0.06+0.94*v*v);
      x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}
    x.restore();
    // кнопка и подчёркивание
    rr(x,56,612,168,54,27);x.fill();
    x.fillRect(54,444,200,24);
  });
  const B=layer(INK.blue,x=>{
    x.textBaseline='alphabetic';
    x.font='24px "Archivo Black"';x.fillText('Overprint',56,48);
    x.font='500 15px "Inter Tight"';['Work','Studio','Paper','Prices'].forEach((s,i)=>x.fillText(s,268+i*86,46));
    x.fillRect(268,52,x.measureText('Work').width,1.5);
    x.textAlign='right';x.fillText('Lisbon, open till 7 pm',1384,46);x.textAlign='left';
    x.font='116px "Archivo Black"';x.letterSpacing='-3px';
    ['Printed','slightly','off.'].forEach((s,i)=>x.fillText(s,50,236+i*116));
    x.letterSpacing='0px';
    x.font='19px "Inter Tight"';
    ['A risograph studio in Lisbon. Zines, posters and','books from 50 copies, in two to four colours,','on recycled paper.'].forEach((s,i)=>x.fillText(s,56,534+i*28));
    x.font='600 16px "Inter Tight"';x.fillText('Get a quote',95,645);
    x.font='500 16px "Inter Tight"';x.fillText('Paper library →',252,645);
    // море волнистыми полосами
    x.save();x.beginPath();x.rect(POS.x,HZ,POS.w,POS.y+POS.h-HZ);x.clip();
    for(let k=0;k<16;k++){const y0=HZ+6+k*15+k*k*0.35,amp=2+k*0.5,th=3+k*0.55;x.lineWidth=th;x.beginPath();
      for(let X=POS.x-10;X<=POS.x+POS.w+10;X+=6){const yy=y0+Math.sin(X/(38+k*3)+k*1.7)*amp;X===POS.x-10?x.moveTo(X,yy):x.lineTo(X,yy)}x.stroke()}
    x.restore();
    x.lineWidth=1.5;x.strokeRect(POS.x,POS.y,POS.w,POS.h);
    x.font='13px "Inter Tight"';x.fillText('Tagus at 6:48 pm. Three colours, A2, edition of 200.',POS.x,POS.y+POS.h+26);
  });
  return [Y,P,B];
}
function grain(){
  const g=document.getElementById('grain'),w=720,h=405;g.width=w;g.height=h;const x=g.getContext('2d'),im=x.createImageData(w,h);
  for(let i=0;i<im.data.length;i+=4){const v=232+rnd()*23|0;im.data[i]=v;im.data[i+1]=v-3;im.data[i+2]=v-10;im.data[i+3]=255}
  x.putImageData(im,0,0);
}
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3),eio=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const sm=v=>{v=cl(v);return v*v*(3-2*v)};
let L=[];const roller=document.getElementById('roller'),kn=document.getElementById('kn'),val=document.getElementById('val'),cur=document.getElementById('cur'),reg=document.getElementById('reg');
// проходы печати: жёлтый, розовый, синий
const PASS=[[0.1,0.62],[0.66,1.18],[1.22,1.74]],T_REG=1.78;
// направление сдвига каждого слоя на 1 px «неприводки»
const DIR=[[-0.95,0.62,-0.028],[1.0,-0.5,0.022],[0,0,0]];
const KX0=24,KX1=206,PUSH=44;
// сценарий: тянем вправо до 26 px, потом влево за ноль; ручка упирается, отпускаем, она отскакивает на 2 px
const T_IN=1.95,T_GRAB=2.48,T_R=3.12,T_BACK=3.28,T_LEFT=4.02,T_REL=4.24,T_TIP=4.3;
function cursorX(t){ // по дорожке, от её левого края
  if(t<T_R)return KX0+(KX1-KX0)*eio((t-T_GRAB)/(T_R-T_GRAB));
  if(t<T_BACK)return KX1;
  if(t<T_REL)return KX1+(KX0-PUSH-KX1)*eio((t-T_BACK)/(T_LEFT-T_BACK));
  return KX0-PUSH;
}
const rubber=d=>15*(1-Math.exp(-d/20));
function knobX(t){
  if(t<T_GRAB)return KX0;
  if(t<T_REL){const c=cursorX(t);return c>=KX0?c:KX0-rubber(KX0-c)}
  const u=t-T_REL,x0=KX0-rubber(PUSH);return KX0-(KX0-x0)*Math.exp(-7*u)*Math.cos(13*u);
}
const pushAt=t=>t<T_REL?Math.max(0,KX0-cursorX(t))/PUSH:0;
function misAt(t){
  if(t<T_REL+0.0&&t<T_REG)return 16;
  const u=t-T_REG,snap=14*Math.exp(-5.5*u)*Math.cos(9*u);
  const k=Math.max(0,(knobX(t-0.06)-KX0)/(KX1-KX0));
  // упёрлись: слои дрожат, но ближе 2 px не сходятся
  const jit=0.8*pushAt(t)*Math.sin(t*95);
  return 2+snap+24*k+jit;
}
let TRX=0;
function cursorAt(t){
  if(t<T_IN)return null;
  const kx=TRX+KX0,ky=731;
  if(t<T_GRAB){const p=eio((t-T_IN)/(T_GRAB-T_IN-0.04));return [1480+(kx-1480)*p,880+(ky-880)*p-Math.sin(p*Math.PI)*60]}
  if(t<T_REL)return [TRX+cursorX(t),ky];
  const p=eo((t-T_REL-0.05)/0.45);return [TRX+KX0-PUSH+16*p,ky+30*p];
}
const tip=document.getElementById('tip');
let lastVal='';
function render(t){
  const m=misAt(t);
  L.forEach((c,i)=>{
    const [a,b]=PASS[i],p=cl((t-a)/(b-a)),d=DIR[i];
    c.style.clipPath=p>=1?'none':`inset(0 0 ${(1-sm(p))*100}% 0)`;
    c.style.transform=`translate(${d[0]*m}px,${d[1]*m}px) rotate(${d[2]*m}deg)`;
  });
  // валик идёт по фронту текущего прохода
  let ry=-100,ro=0;PASS.forEach(([a,b])=>{if(t>=a-0.05&&t<=b+0.08){ry=sm((t-a)/(b-a))*H;ro=Math.min(1,(t-a+0.05)/0.1,(b+0.08-t)/0.1)}});
  roller.style.top=ry+'px';roller.style.opacity=Math.max(0,ro);
  reg.style.opacity=eo((t-1.62)/0.45);
  const kx=knobX(t);kn.style.left=kx+'px';kn.classList.toggle('on',t>=T_GRAB&&t<T_REL);
  const v=Math.max(2,Math.round(t<T_REG?16:m))+' px off';if(v!==lastVal){lastVal=v;val.textContent=v}
  const tp=t-T_TIP,tq=tp<0?0:1-Math.exp(-9*tp)*Math.cos(11*tp);
  tip.style.opacity=cl(tp/0.15);tip.style.left=kx+'px';tip.style.transform=`translateX(-50%) translateY(${(1-tq)*8}px) scale(${0.85+0.15*tq})`;
  const c=cursorAt(t);cur.style.display=c?'block':'none';
  if(c){const press=(t>=T_GRAB&&t<T_REL)?0.88:1;cur.style.transform=`translate(${c[0]-2}px,${c[1]-2}px) scale(${press})`}
}

// звук: барабан ризографа на каждом проходе, щелчки делений слайдера
window.__renderAudio=async()=>{
  const SR=48000,DUR=window.__dur,ac=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR);
  const nb=ac.createBuffer(1,SR*2,SR),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=rnd()*2-1;
  const out=ac.createGain();out.connect(ac.destination);
  const pan=v=>{const p=ac.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,v));p.connect(out);return p};
  const noise=(t,len,dst)=>{const s=ac.createBufferSource();s.buffer=nb;s.connect(dst);s.start(t,rnd()*1.2,len+0.05)};
  const env=(t,att,dec,peak)=>{const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.setTargetAtTime(0,t+att,dec/3);return g};
  const tick=(t,p,gain,f)=>{const g=env(t,0.001,0.02,gain);g.connect(pan(p));const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=2;bp.connect(g);noise(t,0.04,bp)};
  const thump=(t,gain,f=110)=>{const o=ac.createOscillator();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*0.55,t+0.12);const g=env(t,0.004,0.14,gain);o.connect(g);g.connect(pan(0));o.start(t);o.stop(t+0.3)};
  // проход: шум бумаги через полосу, качающийся с оборотом барабана, гул мотора, клац в конце
  PASS.forEach(([a,b],i)=>{
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100+i*120;bp.Q.value=0.9;
    const g=ac.createGain();g.gain.setValueAtTime(0,a-0.04);g.gain.linearRampToValueAtTime(0.22,a+0.06);g.gain.setValueAtTime(0.22,b-0.06);g.gain.linearRampToValueAtTime(0,b+0.05);
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=11;lg.gain.value=0.09;lfo.connect(lg);lg.connect(g.gain);lfo.start(a-0.04);lfo.stop(b+0.06);
    bp.connect(g);g.connect(pan(0));noise(a-0.04,b-a+0.12,bp);
    const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=74;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;
    const og=ac.createGain();og.gain.setValueAtTime(0,a-0.04);og.gain.linearRampToValueAtTime(0.05,a+0.05);og.gain.setValueAtTime(0.05,b-0.05);og.gain.linearRampToValueAtTime(0,b+0.04);
    o.connect(lp);lp.connect(og);og.connect(pan(0));o.start(a-0.04);o.stop(b+0.06);
    thump(b+0.01,0.22);tick(b+0.012,0,0.28,2400);
  });
  thump(T_REG+0.04,0.12,160);
  // деления слайдера: щелчок на каждый пиксель
  const panAt=t=>{const c=cursorAt(t);return c?(c[0]-720)/720*0.8:0};
  let prev=Math.round(misAt(T_GRAB));
  for(let t=T_GRAB;t<T_REL+0.6;t+=0.002){const v=Math.max(2,Math.round(misAt(t)));if(v!==prev){prev=v;tick(t,panAt(t),0.15,3400+rnd()*500)}}
  // упор: мягкий удар и дребезг, пока давим
  thump(T_LEFT-0.2,0.14,210);
  for(let t=T_LEFT-0.18;t<T_REL;t+=0.035)tick(t,panAt(t),0.05*pushAt(t),1800);
  tick(T_GRAB,panAt(T_GRAB),0.16,4600);tick(T_REL,panAt(T_REL),0.12,4200);
  // подсказка
  [[880,1],[1320,0.4]].forEach(([f,k])=>{const o=ac.createOscillator();o.frequency.value=f;const g=env(T_TIP,0.004,0.12,0.09*k);o.connect(g);g.connect(pan(-0.6));o.start(T_TIP);o.stop(T_TIP+0.3)});
  const buf=await ac.startRendering();
  const n=buf.length,ab=new ArrayBuffer(44+n*4),dv=new DataView(ab),ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  const L0=buf.getChannelData(0),R0=buf.getChannelData(1);
  for(let i=0;i<n;i++){dv.setInt16(44+i*4,Math.max(-1,Math.min(1,L0[i]))*32767,true);dv.setInt16(46+i*4,Math.max(-1,Math.min(1,R0[i]))*32767,true)}
  let bin='';const u=new Uint8Array(ab);for(let i=0;i<u.length;i+=32768)bin+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
  return btoa(bin);
};

window.__dur=5.35;window.__render=render;
window.__ready=Promise.all(['24px "Archivo Black"','116px "Archivo Black"','500 15px "Inter Tight"','600 16px "Inter Tight"','19px "Inter Tight"'].map(f=>document.fonts.load(f))).then(()=>{L=build();grain();TRX=document.querySelector('.reg .tr').getBoundingClientRect().left;render(0)});
if(!/rec/.test(location.search)){
  const fit=()=>{const k=Math.min(innerWidth/1440,innerHeight/810);document.body.style.transform=`scale(${k})`;document.body.style.transformOrigin='0 0'};
  window.__ready.then(()=>{fit();addEventListener('resize',fit);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){render(window.__dur);return}
    const t0=performance.now();const loop=n=>{render(((n-t0)/1000)%(window.__dur+0.3));requestAnimationFrame(loop)};requestAnimationFrame(loop)})}
</script>
</body>
</html>
