<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pace, running app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Geist:wght@400;500;600&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--head:'Inter Tight',system-ui,sans-serif;--body:'Geist',system-ui,sans-serif;--bg:#0c0c0b;--ink:#f1efe8;--mid:#8b8a84;--low:#4a4945;--line:rgba(241,239,232,.1);--or:#ff5a1f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);height:100%}
body{overflow:hidden;font-family:var(--body);line-height:1.4;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
#stage{position:absolute;left:50%;top:0;width:1440px;height:810px;margin-left:-720px;transform-origin:50% 0;background:var(--bg);overflow:hidden}
#map{position:absolute;left:0;top:0;transform-origin:1060px 470px}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 30%,rgba(12,12,11,.6) 46%,transparent 62%);pointer-events:none}

nav{position:absolute;left:0;right:0;top:0;height:80px;padding:0 56px;display:flex;align-items:center;font-size:15px;z-index:3}
.brand{font-family:var(--head);font-weight:700;font-size:24px;letter-spacing:.005em}
.links{display:flex;gap:30px;margin-left:68px;color:var(--mid)}
.links a:hover{color:var(--ink)}
.right{margin-left:auto;display:flex;gap:24px;align-items:center}
.right a.b{color:var(--ink)}
.right{color:var(--mid)}

.col{position:absolute;left:56px;top:168px;z-index:2}
h1{font-family:var(--head);font-weight:600;font-size:96px;line-height:1.0;letter-spacing:.005em}
h1 span{display:block;overflow:hidden;padding-top:6px;margin-top:-6px}
h1 span i{display:block;font-style:normal}
.lede{margin-top:24px;width:420px;font-size:18px;color:var(--mid)}
.ctas{margin-top:32px;display:flex;gap:14px}
.btn{font-weight:500;font-size:18px;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.store{height:52px;padding:0 20px;border-radius:12px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
.store small{display:block;font-size:10.5px;font-weight:400;opacity:.6;line-height:1}
.store.o{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(241,239,232,.3)}

.stats{display:none}
.stats div{width:150px;padding-right:20px}
.stats small{display:block;font-size:14px;color:var(--mid);margin-bottom:2px}
.stats b{font-family:var(--head);font-weight:600;font-size:36px;letter-spacing:.005em;font-variant-numeric:tabular-nums}
.stats b span{font-size:17px;font-weight:500;color:var(--mid);margin-left:3px}
.prof{position:absolute;left:56px;right:56px;bottom:40px;height:86px;z-index:2;cursor:ew-resize}
.prof svg{position:absolute;inset:0;overflow:visible}
.km{position:absolute;top:-28px;font-size:15px;font-weight:500;color:var(--ink);transform:translateX(-50%);white-space:nowrap}
.who{display:none;position:absolute;right:56px;top:120px;z-index:2;text-align:right;font-size:13px;color:var(--mid);line-height:1.5}
.who b{color:var(--ink);font-weight:500;font-size:15px}
.climb{position:absolute;z-index:2;width:220px;padding:2px 0 2px 14px;border-left:1px solid var(--or);font-size:13.5px;color:var(--mid);line-height:1.45;pointer-events:none;transform-origin:0 100%}
.climb b{display:block;color:var(--ink);font-weight:500;font-size:14px;margin-bottom:2px}
.climb em{display:block;margin-top:2px;font-style:normal;color:var(--or);font-size:13.5px}
#cur{position:absolute;left:0;top:0;width:22px;height:30px;z-index:50;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
<svg id="map" width="1440" height="810"></svg>
<div class="fade"></div>
<nav id="nav">
  <a class="brand" href="#">Pace</a>
  <div class="links"></div>
  <div class="right"><a href="#">Routes</a><a href="#">Log in</a><a class="b" href="#">Get Pace</a></div>
</nav>

<div class="col">
  <h1><span><i>Every hill</i></span><span><i>counts.</i></span></h1>
  <p class="lede" id="lede">Pace plans your run around the real ground under it, then tells you which climb cost you the most and how to run it next time.</p>
  <div class="ctas" id="ctas"><a class="btn" href="#">Get Pace for iPhone and Android</a></div>
</div>
<div class="who" id="who"><b>Sunday long run</b><br>Hollow Ridge loop</div>

<div class="stats" id="stats">
  <div><small>Distance</small><b id="sd">0.0<span>km</span></b></div>
  <div><small>Time</small><b id="st">0:00</b></div>
  <div><small>Pace</small><b id="sp">0:00<span>/km</span></b></div>
  <div><small>Elevation</small><b id="se">+0<span>m</span></b></div>
</div>
<div class="prof" id="prof"><svg id="psvg" width="1328" height="86"></svg><div class="km" id="km"></div></div>
<div class="climb" id="climb"></div>
<svg id="cur" viewBox="0 0 22 30"><path d="M2 2v22.5l5.6-5.3 3.6 8.3 3.6-1.6-3.5-8.1h7.7z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>

<script>
const $=id=>document.getElementById(id),stage=$('stage'),REC=/rec/.test(location.search);
const cl=x=>Math.max(0,Math.min(1,x)),lerp=(a,b,p)=>a+(b-a)*p;
const E={lin:cl,eo:x=>1-Math.pow(1-cl(x),3),ei:x=>cl(x)**2,eio:x=>{x=cl(x);return x<.5?4*x**3:1-Math.pow(-2*x+2,3)/2},
  back:x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}};

// рельеф: шум из нескольких октав, из него и горизонтали, и высоты маршрута
const hash=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return (hash(i,j)*(1-u)+hash(i+1,j)*u)*(1-v)+(hash(i,j+1)*(1-u)+hash(i+1,j+1)*u)*v};
const H=(x,y)=>{x/=210;y/=210;return .55*vn(x+3.1,y+1.7)+.3*vn(x*2.1+8,y*2.1+2)+.15*vn(x*4.3,y*4.3+5)};
const G=8,NX=Math.ceil(1440/G)+1,NY=Math.ceil(810/G)+1,vals=new Float64Array(NX*NY);
for(let j=0;j<NY;j++)for(let i=0;i<NX;i++)vals[j*NX+i]=H(i*G,j*G);
const map=d3.select('#map');
const conts=d3.contours().size([NX,NY]).thresholds(d3.range(.18,.95,.032))(vals);
const gpath=d3.geoPath(d3.geoIdentity().scale(G));
const cps=map.append('g').selectAll('path').data(conts).join('path').attr('d',gpath).attr('fill','none')
  .attr('stroke',(d,i)=>i%5===0?'rgba(241,239,232,.26)':'rgba(241,239,232,.1)').attr('stroke-width',(d,i)=>i%5===0?1.1:.8).nodes();

// маршрут: петля через хребет справа
const ctrl=[[760,610],[850,470],[960,420],[1080,300],[1210,250],[1330,330],[1300,470],[1180,560],[1060,640],[900,690]];
const line=d3.line().curve(d3.curveCatmullRomClosed.alpha(.5));
const ghost=map.append('path').attr('d',line(ctrl)).attr('fill','none').attr('stroke','rgba(255,90,31,.25)').attr('stroke-width',4).attr('stroke-linejoin','round').node();
const route=map.append('path').attr('d',line(ctrl)).attr('fill','none').attr('stroke','#ff5a1f').attr('stroke-width',3.5).attr('stroke-linecap','round').node();
const RL=route.getTotalLength();route.style.strokeDasharray=RL;
const N=500,S=[];for(let i=0;i<=N;i++){const p=route.getPointAtLength(RL*i/N);S.push({x:p.x,y:p.y,e:Math.round(40+H(p.x,p.y)*380)})}
const KM=21.1,TOT=98*60+42;
let acc=0;S.forEach((s,i)=>{if(i){const g=(s.e-S[i-1].e)/(KM*1000/N);s.sec=270+g*700;acc+=Math.max(200,s.sec)*KM/N}s.t=acc});
const tk=TOT/acc;S.forEach(s=>s.t*=tk);
const GAIN=[0];for(let k=1;k<=N;k++)GAIN[k]=GAIN[k-1]+Math.max(0,S[k].e-S[k-1].e);
// самый тяжёлый подъём: окно в 2 км с наибольшим набором
const WN=Math.round(2/KM*N);let CI=Math.round(N*.3);for(let i=CI;i<N*.72;i++)if(GAIN[i+WN]-GAIN[i]>GAIN[CI+WN]-GAIN[CI])CI=i;
const C0=CI/N,C1=(CI+WN)/N,CG=Math.round(GAIN[CI+WN]-GAIN[CI]);
const climbPath=map.append('path').attr('d',d3.line()(S.slice(CI,CI+WN+1).map(s=>[s.x,s.y]))).attr('fill','none').attr('stroke','#f1efe8').attr('stroke-width',5).attr('stroke-linecap','round').attr('opacity',0).node();
const start=map.append('g').node();
d3.select(start).append('circle').attr('cx',S[0].x).attr('cy',S[0].y).attr('r',9).attr('fill','none').attr('stroke','#f1efe8').attr('stroke-width',2);
d3.select(start).append('text').attr('x',S[0].x-16).attr('y',S[0].y+4).attr('text-anchor','end').attr('fill','#f1efe8').attr('font-family','Geist').attr('font-size',13).text('Start and finish');
const halo=map.append('circle').attr('r',22).attr('fill','#ff5a1f').attr('opacity',0).node();
const dot=map.append('circle').attr('r',8).attr('fill','#f1efe8').attr('stroke','#ff5a1f').attr('stroke-width',3.5).node();
const KMS=[5,10,15,20].map(k=>{const s=S[Math.round(k/KM*N)],g=map.append('g').attr('transform',`translate(${s.x},${s.y})`);
  g.append('circle').attr('r',3).attr('fill','#0c0c0b').attr('stroke','#f1efe8').attr('stroke-width',1.5);
  g.append('text').attr('x',10).attr('y',-8).attr('fill','#8b8a84').attr('font-family','Geist').attr('font-size',12).text(k+' km');
  return {f:k/KM,g:g.node(),x:s.x,y:s.y}});

// профиль высоты внизу
const PW=1328,PH=86,ps=d3.select('#psvg'),emin=d3.min(S,s=>s.e)-20,emax=d3.max(S,s=>s.e);
const px=i=>i/N*PW,py=e=>PH-(e-emin)/(emax-emin)*(PH-10);
const area=d3.area().x((s,i)=>px(i)).y0(PH).y1(s=>py(s.e)).curve(d3.curveBasis);
const clipBg=ps.append('clipPath').attr('id','cp').append('rect').attr('height',PH+20).attr('y',-20).node();
const pg=ps.append('g').attr('clip-path','url(#cp)');
pg.append('path').attr('d',area(S)).attr('fill','rgba(241,239,232,.07)');
pg.append('rect').attr('x',px(CI)).attr('width',px(WN)).attr('y',0).attr('height',PH).attr('fill','rgba(241,239,232,.03)');
pg.append('path').attr('d',d3.line().x((s,i)=>px(i)).y(s=>py(s.e)).curve(d3.curveBasis)(S)).attr('fill','none').attr('stroke','rgba(241,239,232,.5)').attr('stroke-width',1.2);
const clipDone=ps.append('clipPath').attr('id','cd').append('rect').attr('height',PH).node();
ps.append('path').attr('d',area(S)).attr('fill','rgba(255,90,31,.18)').attr('clip-path','url(#cd)');
ps.append('line').attr('x1',0).attr('x2',PW).attr('y1',PH).attr('y2',PH).attr('stroke','rgba(241,239,232,.2)');
const pl=ps.append('line').attr('y1',-6).attr('y2',PH).attr('stroke','#ff5a1f').attr('stroke-width',1.5).node();

// подсказка о подъёме: над вершиной окна
const peak=S.slice(CI,CI+WN+1).reduce((a,b)=>a.y<b.y?a:b);
const climb=$('climb');climb.style.left=(peak.x>1100?peak.x-232:peak.x+18)+"px";climb.style.top=(peak.y-40)+"px";climb.style.transformOrigin=peak.x>1100?"100% 0":"0 0";
const cpace=(S[CI+WN].t-S[CI].t)/2;
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
climb.innerHTML=`<b>Hollow Ridge climb</b>From km ${(C0*KM).toFixed(1)} to ${(C1*KM).toFixed(1)}, +${CG} m<br><em>${fmt(cpace)} per km on the climb</em>`;

const set=(el,v)=>{if(el.__v!==v){el.__v=v;el.textContent=v}};
function draw(Z){
  const f=cl(Z.f),i=Math.round(f*N),s=S[i];
  // текст
  const R=Z.rev;
  [...document.querySelectorAll('h1 span i')].forEach((el,k)=>{el.style.transform=`translateY(${(1-E.eo((R-.15-k*.12)/.8))*105}%)`});
  [['lede',.55],['ctas',.7],['stats',.9],['who',1]].forEach(([id,d])=>{const p=E.eo((R-d)/.6);$(id).style.opacity=p;$(id).style.transform=`translateY(${(1-p)*12}px)`});
  $('nav').style.opacity=E.eo(R/.5);
  // горизонтали проступают по высоте
  cps.forEach((p,k)=>{p.style.opacity=E.eo((R-.1-k*.028)/.45)});
  $('map').style.transform=`scale(${1+.035*(1-E.eo(R/4.4))})`;
  // маршрут и бегун
  route.style.strokeDashoffset=RL*(1-f);ghost.style.opacity=Z.ghost;start.style.opacity=Z.ghost;
  dot.setAttribute('cx',s.x);dot.setAttribute('cy',s.y);dot.style.opacity=Z.ghost;
  halo.setAttribute('cx',s.x);halo.setAttribute('cy',s.y);halo.setAttribute('r',22+Z.halo*26);halo.setAttribute('opacity',Z.halo>0&&Z.halo<1?.3*(1-Z.halo):0);
  KMS.forEach((k,j)=>{const p=Z.km[j];k.g.style.opacity=cl(p*2);k.g.setAttribute('transform',`translate(${k.x},${k.y}) scale(${p>0?.6+.4*E.back(p):0})`)});
  // профиль
  clipBg.setAttribute('width',PW*Z.prof);clipDone.setAttribute('width',px(i));
  pl.setAttribute('x1',px(i));pl.setAttribute('x2',px(i));pl.style.opacity=Z.ghost;
  // одна подпись у бегунка вместо ряда цифр: дистанция, время, темп
  const j=Math.max(1,i),a=Math.max(0,j-12),sp=(S[j].t-S[a].t)/((j-a)*KM/N);
  const km=$('km');km.style.left=px(i)+'px';km.style.opacity=Z.ghost;set(km,(f*KM).toFixed(1)+' km, '+fmt(s.t)+(i>4?', '+fmt(sp)+' per km':''));
  set($('sd').firstChild,(f*KM).toFixed(1));set($('st'),fmt(s.t));set($('sp').firstChild,i>4?fmt(sp):'0:00');set($('se').firstChild,'+'+Math.round(GAIN[i]));
  // подъём подсвечивается, когда бегун на нём
  const on=Z.climb;climbPath.setAttribute('opacity',on*.95);
  climb.style.opacity=on;climb.style.transform=`translateY(${(1-on)*8}px) scale(${.96+.04*on})`;
  // курсор
  const c=$('cur');if(Z.cur){c.style.display='block';c.style.transform=`translate(${Z.cur[0]-2}px,${Z.cur[1]-2}px)`}else c.style.display='none';
}

// ролик: текст и рельеф, бегун проходит маршрут, курсор отматывает к самому тяжёлому подъёму
const T_RUN=.95,T_END=4.25,DUR=7.6;
const fRun=t=>E.eio((t-T_RUN)/(T_END-T_RUN));
const xOf=f=>56+f*PW,PY=742,XC=xOf((C0+C1)/2+.012);
const CP=[[4.6,1500,890],[5.2,xOf(1)-4,PY,'eo'],[5.4,xOf(1)-4,PY,'lin'],[6.45,XC,PY+2,'eio'],[6.8,XC+8,PY,'eio'],[DUR+1,XC+8,PY,'lin']];
function curAt(t){if(t<CP[0][0])return null;for(let k=0;k<CP.length-1;k++){const [a,x0,y0]=CP[k],[b,x1,y1,e]=CP[k+1];if(t<b){const p=E[e]((t-a)/(b-a));return [lerp(x0,x1,p),lerp(y0,y1,p)+(k===0?-Math.sin(p*Math.PI)*30:0)]}}return CP[CP.length-1].slice(1,3)}
const climbOn=f=>cl(Math.min((f-C0)/.03,(C1-f)/.03,1));
// когда бегун проходит отметку километра
const tAtF=g=>{let lo=T_RUN,hi=T_END;for(let k=0;k<30;k++){const m=(lo+hi)/2;fRun(m)<g?lo=m:hi=m}return lo};
const TKM=KMS.map(k=>tAtF(k.f));
function stateAt(t){
  const c=curAt(t);let f=fRun(t);
  if(t>5.4&&c)f=cl((c[0]-56)/PW);
  return {rev:t,f,ghost:E.eo((t-.85)/.3),halo:cl((t-T_END)/.9),prof:E.eo((t-.5)/.8),km:TKM.map(a=>cl((t-a)/.35)),
    climb:t>5.4?climbOn(f):0,cur:c};
}
function render(t){draw(stateAt(t))}

// звук: собирается офлайн по тем же таймингам
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
async function buildAudio(){
  seed=11;const SR=48000,ac=new OfflineAudioContext(2,Math.ceil(SR*DUR),SR);
  const nb=ac.createBuffer(1,SR*2,SR),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=rnd()*2-1;
  const out=ac.createGain();out.gain.value=.9;out.connect(ac.destination);
  const pan=v=>{const p=ac.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,v));p.connect(out);return p};
  const noise=(t,len,dst)=>{const s=ac.createBufferSource();s.buffer=nb;s.connect(dst);s.start(t,rnd()*1.4,len+.05)};
  const env=(t,att,dec,peak)=>{const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.setTargetAtTime(0,t+att,dec/3);return g};
  const pxp=x=>(x-720)/720*.8;
  const band=(t0,t1,f0,f1,gain,p,q=1,shape=x=>Math.sin(Math.PI*x))=>{const bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;
    bp.frequency.setValueAtTime(f0,t0);bp.frequency.exponentialRampToValueAtTime(f1,t1);
    const g=ac.createGain(),n=96,c=new Float32Array(n);for(let i=0;i<n;i++)c[i]=gain*shape(i/(n-1));g.gain.setValueCurveAtTime(c,t0,t1-t0);bp.connect(g);g.connect(pan(p));noise(t0,t1-t0,bp)};
  const tone=(t,f,len,gain,p=0,type='sine')=>{const o=ac.createOscillator();o.type=type;o.frequency.value=f;const g=env(t,.003,len,gain);o.connect(g);g.connect(pan(p));o.start(t);o.stop(t+len+.1)};
  // горизонтали: воздух поднимается
  band(.05,1.5,260,900,.07,.2,.6,x=>Math.pow(Math.sin(Math.PI*x),2));
  // шаги: глухие удары, левая-правая
  for(let t=T_RUN+.05,k=0;t<T_END;t+=.205,k++){
    const s=S[Math.round(fRun(t)*N)],lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;const g=env(t,.004,.09,.34);lp.connect(g);g.connect(pan(pxp(s.x)+(k%2?.12:-.12)));noise(t,.1,lp);
    const hp=ac.createBiquadFilter();hp.type='bandpass';hp.frequency.value=3200;hp.Q.value=1.2;const g2=env(t+.008,.002,.03,.05);hp.connect(g2);g2.connect(pan(pxp(s.x)));noise(t,.04,hp)}
  // тон высоты: повторяет рельеф, пока бегун идёт
  {const o=ac.createOscillator();o.type='triangle';const n=160,fr=new Float32Array(n);for(let i=0;i<n;i++){const t=T_RUN+(T_END-T_RUN)*i/(n-1),e=S[Math.round(fRun(t)*N)].e;fr[i]=110+(e-emin)/(emax-emin)*120}
    o.frequency.setValueCurveAtTime(fr,T_RUN,T_END-T_RUN);const g=ac.createGain(),gc=new Float32Array(64);for(let i=0;i<64;i++)gc[i]=.05*Math.sin(Math.PI*i/63)**.5;g.gain.setValueCurveAtTime(gc,T_RUN,T_END-T_RUN+.2);
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;o.connect(lp);lp.connect(g);g.connect(pan(.15));o.start(T_RUN);o.stop(T_END+.4)}
  // часы пищат на каждой пятёрке
  TKM.forEach((t,j)=>{tone(t,1760,.07,.06,pxp(KMS[j].x));tone(t+.09,1760,.07,.05,pxp(KMS[j].x))});
  // финиш: двойной сигнал повыше и мягкий удар
  tone(T_END,2093,.12,.08,pxp(S[0].x));tone(T_END+.13,2637,.22,.07,pxp(S[0].x));
  {const o=ac.createOscillator();o.frequency.setValueAtTime(120,T_END);o.frequency.exponentialRampToValueAtTime(55,T_END+.3);const g=env(T_END,.005,.35,.25);o.connect(g);g.connect(pan(0));o.start(T_END);o.stop(T_END+.5)}
  // курсор влетает
  band(4.6,5.2,700,1600,.04,.6,.8);
  // перемотка назад: трещотка на каждые полкилометра
  let last=null;for(let t=5.4;t<6.8;t+=1/240){const c=curAt(t),f=cl((c[0]-56)/PW),k=Math.floor(f*KM*2);if(last!==null&&k!==last){const g=env(t,.001,.02,.12);const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600+k*40;bp.Q.value=2;bp.connect(g);g.connect(pan(pxp(c[0])));noise(t,.03,bp)}last=k}
  // подсказка о подъёме
  const tc=(()=>{for(let t=5.4;t<7;t+=1/240){const c=curAt(t);if(climbOn(cl((c[0]-56)/PW))>.5)return t}return 6.3})();
  tone(tc,659,.25,.05,.3);tone(tc+.06,988,.3,.04,.3);
  return ac.startRendering();
}
window.__renderAudio=async()=>{
  const buf=await buildAudio();
  const n=buf.length,ab=new ArrayBuffer(44+n*4),dv=new DataView(ab),ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);
  dv.setUint32(24,48000,true);dv.setUint32(28,48000*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  const L0=buf.getChannelData(0),R0=buf.getChannelData(1);
  for(let i=0;i<n;i++){dv.setInt16(44+i*4,Math.max(-1,Math.min(1,L0[i]))*32767,true);dv.setInt16(46+i*4,Math.max(-1,Math.min(1,R0[i]))*32767,true)}
  let bin='';const u=new Uint8Array(ab);for(let i=0;i<u.length;i+=32768)bin+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
  return btoa(bin);
};
window.__dur=DUR;window.__render=render;

if(!REC){
  const fit=()=>{stage.style.transform=`scale(${Math.min(innerWidth/1440,innerHeight/810,1.25)})`};fit();addEventListener('resize',fit);
  // после ролика можно перематывать самому: по профилю или по карте
  let mode='intro',t0=0,f=0,tgt=0,ac=null,lastK=null,abuf=null;
  const pos=e=>{const r=stage.getBoundingClientRect(),k=r.width/1440;return [(e.clientX-r.left)/k,(e.clientY-r.top)/k]};
  stage.addEventListener('pointermove',e=>{if(mode!=='live')return;const [x,y]=pos(e);
    if(y>650&&x>40&&x<1400){tgt=cl((x-56)/PW);return}
    let bi=-1,bd=70*70;S.forEach((s,i)=>{const d=(s.x-x)**2+(s.y-y)**2;if(d<bd){bd=d;bi=i}});if(bi>=0)tgt=bi/N});
  addEventListener('pointerdown',()=>{if(ac)return;try{ac=new AudioContext();buildAudio().then(b=>abuf=b)}catch(e){}});
  const tick=k=>{if(!ac)return;const t=ac.currentTime,b=ac.createBuffer(1,800,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/120);
    const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();bp.type='bandpass';bp.frequency.value=2600+k*40;bp.Q.value=2;g.gain.value=.25;s.buffer=b;s.connect(bp);bp.connect(g);g.connect(ac.destination);s.start(t)};
  document.fonts.ready.then(()=>{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){render(DUR);return}
    t0=performance.now();
    const loop=n=>{
      if(mode==="intro"){const t=(n-t0)/1000;if(t<DUR){const S=stateAt(t);S.cur=null;draw(S)}else{mode='live';f=tgt=stateAt(DUR).f}}
      if(mode==='live'){f+=(tgt-f)*.15;const k=Math.floor(f*KM*2);if(lastK!==null&&k!==lastK)tick(k);lastK=k;
        draw({rev:DUR,f,ghost:1,halo:1,prof:1,km:[1,1,1,1],climb:climbOn(f),cur:null})}
      requestAnimationFrame(loop)};
    requestAnimationFrame(loop)});
}else{document.fonts.ready.then(()=>render(0))}
</script>
