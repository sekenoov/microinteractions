<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rabbit Hole</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <section class="panel chat" id="chat">
      <header class="chead">
        <span class="ctitle" id="title"><span></span><span></span></span>
        <button class="icb hb" aria-label="New chat" tabindex="-1">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.8H6A2.2 2.2 0 0 0 3.8 6v8A2.2 2.2 0 0 0 6 16.2h8a2.2 2.2 0 0 0 2.2-2.2v-3"/><path d="M14.6 3.2l2.2 2.2-6.4 6.4-2.9.7.7-2.9z"/></svg>
        </button>
      </header>
      <div class="thread" id="thread">
        <div class="fly" id="fly"><i class="fsel"></i><i class="fbub"></i><span></span></div>
        <div class="menu" id="menu" role="menu">
          <span class="mi" role="menuitem">Copy</span><span class="md"></span><span class="mi ask" role="menuitem">Ask</span>
        </div>
      </div>
      <div class="composer">
        <div class="cfield">Ask anything</div>
        <button class="send dim" aria-label="Send" tabindex="-1">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 16V4.6M4.8 9.8L10 4.4l5.2 5.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <svg class="cur" id="cur" viewBox="0 0 24 24" aria-hidden="true">
        <g class="arrow"><path d="M5 2.6v16.2l4-3.9 2.6 6 2.7-1.2-2.6-5.9h5.6z" fill="#fff"/><path d="M6.2 5.4v10.6l2.9-2.8 2.8 6.3.6-.3-2.7-6.2h4.1z" fill="#111"/></g>
        <g class="beam"><path d="M8.4 3.2h2.2c.6 0 1.1.3 1.4.7.3-.4.8-.7 1.4-.7h2.2v1.9h-2c-.5 0-.8.3-.8.8v4.5h1.3v1.9h-1.3v4.6c0 .5.3.8.8.8h2v1.9h-2.2c-.6 0-1.1-.3-1.4-.7-.3.4-.8.7-1.4.7H8.4v-1.9h2c.5 0 .8-.3.8-.8v-4.6H9.9v-1.9h1.3V5.9c0-.5-.3-.8-.8-.8h-2z" fill="#fff"/><path d="M9 3.9h1.6c.8 0 1.4.5 1.4 1.2 0-.7.6-1.2 1.4-1.2H15v.6h-1.6c-.8 0-1.1.5-1.1 1.2v5.2h1.3v.6h-1.3v5.3c0 .7.3 1.2 1.1 1.2H15v.6h-1.6c-.8 0-1.4-.5-1.4-1.2 0 .7-.6 1.2-1.4 1.2H9v-.6h1.6c.8 0 1.1-.5 1.1-1.2v-5.3h-1.3v-.6h1.3V5.7c0-.7-.3-1.2-1.1-1.2H9z" fill="#111"/></g>
      </svg>
    </section>
  </div>

  <div class="tools" id="tools">
    <button class="ghost" id="play">Pause</button>
    <span class="hint">Select a word, ask about it, repeat</span>
    <div class="seg-ctl" id="theme" role="group" aria-label="Theme">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
